name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install numpy==2.5.4 opencc==1.4.2 pytest==8.4.2
      - run: python -m pytest -q tests

  windows:
    runs-on: windows-latest
    env:
      # The runner context is not available at job level; github is.
      KONG_HOME: ${{ github.workspace }}\kong-home
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Get a test recording
        shell: bash
        run: |
          curl -sSL -o sv.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17.tar.bz2
          tar xjf sv.tar.bz2 sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/test_wavs/zh.wav
          mv sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/test_wavs/zh.wav test-zh.wav

      - name: Self-test from source
        continue-on-error: true  # the report step below decides
        run: python -m kong selftest --out selftest-source.json --wav test-zh.wav --qwen

      - name: Build
        run: |
          python -c "from kong.ui.icon import write_ico; write_ico('packaging/kong.ico')"
          pyinstaller packaging/kong.spec --noconfirm

      - name: Self-test the built Kong.exe
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Kong\Kong.exe -ArgumentList 'selftest','--out','selftest-frozen.json','--wav','test-zh.wav','--qwen' -Wait -PassThru
          Get-Content selftest-frozen.json
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Report self-test results
        if: always()
        run: python tools/ci_annotate.py selftest-source.json selftest-frozen.json

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist\Kong -DestinationPath Kong-windows-x64.zip

      # The artifact download is itself a zip: upload the folder so users unzip only once.
      - uses: actions/upload-artifact@v4
        with:
          name: Kong-windows-x64
          path: dist/Kong

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-reports
          path: selftest-*.json

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Kong-windows-x64.zip
